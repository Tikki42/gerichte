<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Quelle des App-Icons. PNGs daraus erzeugen (siehe README). iOS rundet die Ecken selbst ab. -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#86E8AC"/>
      <stop offset="0.45" stop-color="#36B06C"/>
      <stop offset="1" stop-color="#11603A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.08" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Glas: oben fast weiß, unten durchscheinend -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.6" stop-color="#f1fbf5" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#d6f2e1" stop-opacity="0.66"/>
    </linearGradient>
    <linearGradient id="soup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f4a640"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#04301a" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Dampf: drei ruhige Schwünge -->
  <g fill="none" stroke="url(#steam)" stroke-width="36" stroke-linecap="round">
    <path d="M408 400 C376 352 440 318 410 262"/>
    <path d="M512 382 C480 328 546 290 514 222"/>
    <path d="M616 400 C584 352 648 318 618 262"/>
  </g>

  <!-- Schüssel aus Glas mit Fuß -->
  <g filter="url(#shadow)">
    <path d="M196 470 H828 A316 316 0 0 1 196 470 Z" fill="url(#glass)"/>
    <rect x="396" y="770" width="232" height="44" rx="22" fill="url(#glass)"/>
  </g>
  <!-- Suppe mit Blatt -->
  <ellipse cx="512" cy="470" rx="306" ry="38" fill="url(#soup)"/>
  <path d="M598 464 C604 404 672 364 742 362 C742 426 678 472 598 464 Z" fill="#2c9a5a"/>
  <path d="M612 456 C648 424 690 394 734 370" fill="none" stroke="#bff0d2" stroke-width="7" stroke-linecap="round"/>
  <!-- Lichtkanten wie bei Glas -->
  <path d="M196 470 A316 316 0 0 0 828 470" fill="none" stroke="url(#edge)" stroke-width="8"/>
  <path d="M196 470 H828" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <path d="M256 520 A262 262 0 0 0 420 740" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
</svg>
